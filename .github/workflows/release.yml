name: Release

# On every push to main, Release Please opens or updates one release PR per
# package that has releasable commits (feat, fix). Merging a release PR tags
# the version, and the publish job below sends that package to npm.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm verify this workflow (trusted publishing) and attach
      # provenance. No npm token is stored in the repo.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./${{ matrix.path }}" build
      - run: pnpm --filter "./${{ matrix.path }}" test
      - run: npm publish --access public
        working-directory: ${{ matrix.path }}
